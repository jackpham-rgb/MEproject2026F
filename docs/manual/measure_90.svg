<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker>
  </defs>
  <rect width="960" height="330" fill="#fff"/>
  <!-- Panel 1: reading 1 -->
  <text x="160" y="24" font-size="19" font-weight="bold" text-anchor="middle">1. "Measured" (first reading)</text>
  <text x="160" y="44" font-size="14" text-anchor="middle">looking down into the hole</text>
  <rect x="40" y="70" width="240" height="190" rx="8" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <ellipse cx="160" cy="165" rx="72" ry="60" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="6" y="152" width="308" height="26" fill="#555" opacity="0.35"/>
  <text x="300" y="148" font-size="13" text-anchor="end">calipers</text>
  <rect x="88" y="157" width="12" height="16" fill="#000"/>
  <rect x="220" y="157" width="12" height="16" fill="#000"/>
  <line x1="102" y1="165" x2="218" y2="165" stroke="#c00000" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="160" y="295" font-size="17" text-anchor="middle">small top jaws open inside the hole</text>
  <text x="160" y="318" font-size="17" text-anchor="middle" font-weight="bold">write e.g. 6.08</text>
  <!-- arrow between -->
  <path d="M300,110 q30,-40 60,0" fill="none" stroke="#000" stroke-width="3" marker-end="url(#a)"/>
  <text x="330" y="62" font-size="15" text-anchor="middle" font-weight="bold">turn ¼ turn</text>
  <text x="330" y="80" font-size="13" text-anchor="middle">(same hole)</text>
  <!-- Panel 2: reading 2 -->
  <text x="490" y="24" font-size="19" font-weight="bold" text-anchor="middle">2. "Measured (90°)"</text>
  <text x="490" y="44" font-size="14" text-anchor="middle">calipers turned a quarter turn</text>
  <rect x="370" y="70" width="240" height="190" rx="8" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <ellipse cx="490" cy="165" rx="72" ry="60" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="477" y="58" width="26" height="214" fill="#555" opacity="0.35"/>
  <rect x="482" y="107" width="16" height="12" fill="#000"/>
  <rect x="482" y="211" width="16" height="12" fill="#000"/>
  <line x1="490" y1="121" x2="490" y2="209" stroke="#c00000" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="490" y="295" font-size="17" text-anchor="middle">printed holes are often slightly oval</text>
  <text x="490" y="318" font-size="17" text-anchor="middle" font-weight="bold">write e.g. 5.92</text>
  <!-- Panel 3: depth -->
  <text x="800" y="24" font-size="19" font-weight="bold" text-anchor="middle">3. Measure mid-depth</text>
  <text x="800" y="44" font-size="14" text-anchor="middle">hole cut in half, seen from the side</text>
  <rect x="680" y="80" width="70" height="170" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <rect x="850" y="80" width="70" height="170" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <path d="M750,225 L762,250 L750,250 z M850,225 L838,250 L850,250 z" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <line x1="660" y1="250" x2="940" y2="250" stroke="#000" stroke-width="4"/>
  <text x="800" y="270" font-size="13" text-anchor="middle">bed side</text>
  <line x1="754" y1="160" x2="846" y2="160" stroke="#008000" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="800" y="150" font-size="16" text-anchor="middle" fill="#008000" font-weight="bold">✔ here</text>
  <text x="800" y="235" font-size="16" text-anchor="middle" fill="#c00000" font-weight="bold">✘ not here</text>
  <text x="800" y="295" font-size="17" text-anchor="middle">first layers bulge in</text>
  <text x="800" y="318" font-size="17" text-anchor="middle">("elephant foot")</text>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D Assembly Guide</title>
<meta name="description" content="Concept A can flipper: step-by-step 3D assembly. Rotate, zoom and pan every step; screws, glue and fit levels shown.">
<style>
:root{--ground:#eef1f4;--panel:#fff;--ink:#14181d;--muted:#56606c;--line:#cfd6de;--accent:#2f6fdb;
  --pr:#2f72e0;--bo:#e8891c;--precise:#c40000;--try:#c77700;--easy:#1f7a45;--glue:#d9b400;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#101317;--panel:#181c22;--ink:#e8ecf1;--muted:#9aa4b1;--line:#2c333c;--accent:#6b9cf0;
  --precise:#ff5a5a;--try:#f0a830;--easy:#5fd08e;--glue:#ffe14d;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#101317;--panel:#181c22;--ink:#e8ecf1;--muted:#9aa4b1;--line:#2c333c;--accent:#6b9cf0;
  --precise:#ff5a5a;--try:#f0a830;--easy:#5fd08e;--glue:#ffe14d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:270px 1fr 380px;height:100vh;height:100dvh}
#app>*{min-width:0}
#steps{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
#steps h1{font-size:17px;margin:0;padding:14px 14px 4px}
#steps .sub{font-size:12.5px;color:var(--muted);padding:0 14px 10px}
#steps .sub a{color:var(--accent)}
.st{display:flex;gap:9px;align-items:center;width:100%;padding:8px 12px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.st:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.st.on{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.st .n{font-weight:800;font-size:16px;width:24px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.st .t{flex:1;min-width:0;font-size:14px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.precise{background:var(--precise)}.dot.try{background:var(--try)}.dot.easy{background:var(--easy)}
#view{position:relative;min-width:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
button.tb,label.tb{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:600 13px system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
label.tb input{margin:0}
#legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;display:grid;gap:3px}
#legend span{display:flex;gap:6px;align-items:center}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
#nav{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
#nav button{font-size:15px;padding:9px 16px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-120%);background:rgba(20,24,29,.86);color:#fff;font:600 12px system-ui,sans-serif;padding:3px 7px;border-radius:5px;white-space:nowrap}
.lab.hole{background:#fff;color:#111;border:2px solid #c40000;transform:translate(-50%,-50%);font-size:12px;white-space:normal;max-width:220px;text-align:center}
.lab.pr{background:#1f58b8}.lab.bo{background:#b35f00}.lab.sc{background:#444}.lab.gl{background:#8a7200}
#info{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
#info .big{font-size:44px;font-weight:800;line-height:1;margin-right:10px}
#info h2{font-size:20px;margin:0;line-height:1.2}
.head{display:flex;align-items:center;margin-bottom:10px}
.lvl{display:block;border-radius:8px;padding:9px 11px;margin:10px 0;font-size:14px;color:#fff}
.lvl b{display:block;font-size:15px;letter-spacing:.04em}
.lvl.precise{background:var(--precise)}.lvl.try{background:var(--try)}.lvl.easy{background:var(--easy)}
.box{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:14px}
.box h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.box.fit{border:2px solid var(--precise);background:color-mix(in srgb,var(--precise) 9%,transparent)}
.box.glue{border:2px solid var(--glue);background:color-mix(in srgb,var(--glue) 14%,transparent)}
.chip{display:inline-block;font:700 12.5px system-ui,sans-serif;padding:3px 8px;border-radius:6px;margin:0 4px 4px 0}
.chip.pr{background:#2f72e0;color:#fff}.chip.bo{background:#e8891c;color:#111}.chip.sc{background:#5b6470;color:#fff}.chip.gl{background:#ffe14d;color:#111}
ul{margin:4px 0;padding-left:18px} li{margin:2px 0}
#measure{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;background:var(--ground)}
#measure.on{display:flex}
#measure svg{width:100%;max-width:900px;height:auto;max-height:calc(100% - 56px);overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:10px}
#mbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
#mbar button.on{outline:2px solid var(--accent)}
.mrow{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:13.5px}
.mrow.done{border-color:var(--easy);background:color-mix(in srgb,var(--easy) 8%,transparent)}
.mrow .top{display:flex;gap:6px;align-items:baseline}
.mrow .pic{display:block;width:100%;height:130px;object-fit:contain;background:#fff;border-radius:6px;margin:6px 0 2px;cursor:zoom-in}
#mpic{display:none;width:100%;max-width:900px;max-height:calc(100% - 56px);object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}
#measure.pic #msvg{display:none}#measure.pic #mpic{display:block}
.mrow .id{font-weight:800;flex:none;width:30px}
.mrow .cad{margin-left:auto;flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.mrow .in{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:5px;margin-top:5px}
.mrow input,.mrow select{width:100%;min-width:0;font:14px system-ui,sans-serif;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink)}
.mrow input.opt::placeholder{font-style:italic;font-size:12px}
#info h4{margin:14px 0 2px;font-size:15px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px}
.tab{flex:1 0 30%;text-align:center;font:700 12.5px system-ui,sans-serif;padding:6px 4px;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 52vh 1fr;height:auto;min-height:100dvh}
  #steps{border-right:0;border-bottom:1px solid var(--line);max-height:none;overflow:visible}
  #steps .list{display:flex;overflow-x:auto;gap:0}
  .st{flex:none;width:auto;border-top:0;border-right:1px solid var(--line);padding:8px 10px}
  .st .t{display:none}
  #view{height:52vh}
  #info{border-left:0;border-top:1px solid var(--line)}
  #legend{display:none}
  #nav button{padding:8px 12px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="steps"><h1>3D assembly guide</h1>
    <div class="sub">Drag to rotate · scroll / pinch to zoom · right-drag / two fingers to pan. <a href="../index.html">All viewers</a> · <a href="../docs/12_assembly_manual.pdf">PDF manual</a></div>
    <div class="list" id="list"></div></aside>
  <main id="view"><div id="loading">Loading the 3D parts (5 MB)…</div><div id="labels"></div>
    <div id="tools">
      <button class="tb" id="replay">▶ Replay step</button>
      <button class="tb" id="fit">⤢ Fit view</button>
      <label class="tb"><input type="checkbox" id="ghost" checked> Fade other parts</label>
      <label class="tb"><input type="checkbox" id="showlab" checked> Labels</label>
      <label class="tb"><input type="checkbox" id="real"> Real colours for printed</label>
    </div>
    <div id="legend">
      <span><i class="sw" style="background:#2f72e0"></i> printed part</span>
      <span><i class="sw" style="background:#fff;border:2px solid #ff8a00"></i> bought part, real look (orange outline = new)</span>
      <span><i class="sw" style="background:#9aa1aa"></i> screw · dashed line = its path</span>
      <span><i class="sw" style="background:#ffe14d"></i> glue</span>
    </div>
    <div id="measure"><img id="mpic" alt=""><svg id="msvg" viewBox="0 0 900 520" font-family="system-ui,Arial,sans-serif"></svg>
      <div id="mbar"><button class="tb" data-t="0">1 · First reading</button><button class="tb" data-t="4.2">2 · Turn ¼ turn, second reading</button><button class="tb" data-t="10">3 · Where in the hole</button><button class="tb" id="mpause">❚❚ Pause</button></div></div>
    <div id="nav"><button class="tb" id="prev">◀ Back</button><button class="tb" id="next">Next ▶</button></div>
  </main>
  <aside id="info"></aside>
</div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
let D;
const DATA = new URLSearchParams(location.search).get("data");
const PLANB = DATA === "planb", FIXES = DATA === "fixes", REDES = DATA === "redesign", HYB = DATA === "hybrid", HYBB = DATA === "hybrid_build";
try { D = await (await fetch(PLANB ? "data/planb.json" : FIXES ? "data/fixes.json" : REDES ? "data/redesign.json" : HYB ? "data/hybrid.json" : HYBB ? "data/hybrid_build.json" : "data/assembly.json")).json(); }
catch (e) { $("loading").textContent = "Couldn't load data/assembly.json. Open this page from the project website (or a local web server), not as a file."; return; }
$("loading").remove();
if (D.title) { document.title = D.title; document.querySelector("#steps h1").textContent = D.title; }
const other = document.querySelector("#steps .sub");
document.querySelector("#steps h1").insertAdjacentHTML("afterend", `<div class="tabs">
  <a class="tab ${!PLANB && !FIXES && !REDES && !HYB && !HYBB ? "on" : ""}" href="assembly.html">Assembly</a>
  <a class="tab ${FIXES ? "on" : ""}" href="assembly.html?data=fixes">Proposed fixes</a>
  <a class="tab ${PLANB ? "on" : ""}" href="assembly.html?data=planb">Plan B</a>
  <a class="tab ${REDES ? "on" : ""}" href="assembly.html?data=redesign">Redesign</a>
  <a class="tab ${HYB ? "on" : ""}" href="assembly.html?data=hybrid">Hybrid</a>
  <a class="tab ${HYBB ? "on" : ""}" href="assembly.html?data=hybrid_build">Hybrid build</a></div>`);
if (FIXES) $("legend").insertAdjacentHTML("beforeend", '<span><i class="sw" style="background:#e0352b;opacity:.45"></i> OLD part (what you printed before)</span>');

// ---------------- scene
const view = $("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";
scene.background = new THREE.Color(dark ? 0x15191e : 0xf3f5f8);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.up.set(0, 0, 1);
camera.position.set(-260, -320, 240);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x9098a4, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-200, -300, 500); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(300, 200, 150); scene.add(fill);
const grid = new THREE.GridHelper(600, 30, dark ? 0x3a424c : 0xc7ced6, dark ? 0x262c33 : 0xe1e6eb);
grid.rotation.x = Math.PI / 2; grid.position.set(0, -60, -0.05); scene.add(grid);

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);

// ---------------- meshes, grouped by owner part
const PRINTED_COL = new THREE.Color(0x2f72e0), BOUGHT_HI = new THREE.Color(0xe8891c);
const owners = {};           // owner -> {group, items:[{mesh, edges, base, kind}]}
for (const m of D.meshes) {
  let g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(m.v, 3)); g.setIndex(m.f);
  g = g.toNonIndexed(); g.computeVertexNormals();
  const base = new THREE.Color(m.color);
  const mat = new THREE.MeshStandardMaterial({ color: base.clone(), roughness: m.kind === "screw" || m.kind === "bought" ? 0.45 : 0.6,
    metalness: m.kind === "screw" ? 0.6 : 0.05, transparent: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const mesh = new THREE.Mesh(g, mat);
  let edges = null;
  if (m.kind === "printed" || m.kind === "can") {
    edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), new THREE.LineBasicMaterial({ color: 0x0b1a33, transparent: true }));
  } else if (m.kind === "bought") {
    edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 35), new THREE.LineBasicMaterial({ color: 0xff8a00, transparent: true }));
  }
  const o = owners[m.owner] || (owners[m.owner] = { group: new THREE.Group(), items: [] });
  o.group.add(mesh); if (edges) o.group.add(edges);
  o.items.push({ mesh, edges, base, kind: m.kind });
}
for (const [n, o] of Object.entries(owners)) { o.group.name = n; scene.add(o.group); o.group.visible = false;
  const b = new THREE.Box3().setFromObject(o.group); o.box = b; o.center = b.getCenter(new THREE.Vector3()); }
const screwBy = Object.fromEntries(D.screws.map(s => [s.name, s]));
const glueSet = new Set(D.glue.map(g => g.name));
const printedSet = new Set(D.printed);

// ---------------- step list
const LV = D.levels;
const steps = [{ n: 0, title: D.fixes ? "What changed, and why" : D.redesign || D.hybrid ? "The idea, and what it saves" : "Before you start", level: null, new: [], show: Object.keys(owners).filter(n => n !== "test_can" && !n.startsWith("old_")).concat(["test_can"]), screws: [], glue: [] },
  ...(D.planb || D.fixes || D.redesign || D.hybrid || D.hybrid_build ? [] : [{ n: "M", title: "Measure first: CAD vs real (calipers)", measure: true, level: null, new: [], show: [], screws: [], glue: [] }]), ...D.steps,
  ...(D.motion ? [{ n: "▶", title: "Watch it run: the whole movement", run: true, level: null, new: [],
    show: Object.keys(owners).filter(n => !n.startsWith("old_")), screws: [], glue: [] }] : [])];
const list = $("list");
steps.forEach((s, i) => {
  const b = document.createElement("button"); b.className = "st"; b.dataset.i = i;
  b.innerHTML = `<span class="n">${s.n || "★"}</span>${s.level ? `<i class="dot ${s.level}" title="${LV[s.level].label}"></i>` : ""}<span class="t">${s.title}</span>`;
  b.onclick = () => go(i); list.appendChild(b);
});

// ---------------- paths (dashed lines for this step's screws)
let pathLines = [];
function clearPaths() { pathLines.forEach(l => scene.remove(l)); pathLines = []; }
function addPath(sc) {
  const h = new THREE.Vector3(...sc.head), a = new THREE.Vector3(...sc.axis);
  const g = new THREE.BufferGeometry().setFromPoints([h.clone().addScaledVector(a, -34), h.clone().addScaledVector(a, sc.length)]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color: dark ? 0xffd34d : 0xc40000, dashSize: 2.2, gapSize: 1.6, depthTest: false, transparent: true }));
  l.computeLineDistances(); l.renderOrder = 10; scene.add(l); pathLines.push(l);
}

// ---------------- state + animation
let cur = 0, anim = null;
const ghostEl = $("ghost"), labEl = $("showlab"), realEl = $("real");
function styleOwner(n, isNew) {
  const o = owners[n]; if (!o) return;
  const ghost = ghostEl.checked && !isNew && cur > 0;
  for (const it of o.items) {
    let c = it.base.clone();
    if (it.kind === "old") { it.mesh.material.color.copy(c); it.mesh.material.opacity = 0.32; it.mesh.material.depthWrite = false; continue; }
    if (it.kind === "printed") c = realEl.checked ? new THREE.Color(0x8fa3b8) : PRINTED_COL.clone();
    if (ghost) c.lerp(new THREE.Color(dark ? 0x2a3038 : 0xffffff), 0.55);
    it.mesh.material.color.copy(c);
    it.mesh.material.opacity = ghost ? 0.5 : 1; it.mesh.material.depthWrite = !ghost;
    if (it.edges) { it.edges.material.opacity = ghost ? 0.18 : 0.75;
      if (it.kind === "bought") it.edges.visible = isNew && cur > 0; }
  }
}
function offsetFor(s, n) {
  if (!s.dist || !(s.new.includes(n))) return null;
  const d = (s.per_part_dir && s.per_part_dir[n]) || s.dir; if (!d) return null;
  return new THREE.Vector3(...d).multiplyScalar(Math.min(s.dist, 70));
}
function go(i) {
  cur = Math.max(0, Math.min(steps.length - 1, i));
  const s = steps[cur];
  document.querySelectorAll(".st").forEach(b => b.classList.toggle("on", +b.dataset.i === cur));
  const sel = document.querySelector(`.st[data-i="${cur}"]`); sel && sel.scrollIntoView({ block: "nearest", inline: "nearest" });
  const isM = !!s.measure;
  $("measure").classList.toggle("on", isM); ["tools", "legend", "labels"].forEach(id => $(id).style.visibility = isM ? "hidden" : "");
  renderer.domElement.style.visibility = isM ? "hidden" : "";
  if (isM) { for (const o of Object.values(owners)) o.group.visible = false; clearPaths(); anim = null; renderInfo(s); M.start(0); return; }
  M.stop();
  const show = new Set(s.show), fresh = new Set([...s.new, ...s.screws, ...s.glue]);
  for (const [n, o] of Object.entries(owners)) { o.group.visible = show.has(n); o.group.position.set(0, 0, 0); o.group.rotation.set(0, 0, 0);
    o.group.matrixAutoUpdate = true; styleOwner(n, fresh.has(n) || cur === 0 || s.run); }
  RUN.t0 = s.run ? performance.now() : null; RUN.paused = false;
  clearPaths(); s.screws.forEach(n => addPath(screwBy[n]));
  renderInfo(s); frame(s, true); play(s);
}
function play(s) {
  const t0 = performance.now();
  anim = { s, t0 };
}
// ---------------- "watch it run": firmware sequence, same kinematics as model.py / the motion viewer
const RUN = { t0: null, paused: false, tp: 0 };
const MO = D.motion, D2R = Math.PI / 180;
function rotAbout(p, axis, deg) {
  return new THREE.Matrix4().makeTranslation(p[0], p[1], p[2])
    .multiply(new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(...axis).normalize(), deg * D2R))
    .multiply(new THREE.Matrix4().makeTranslation(-p[0], -p[1], -p[2]));
}
function mats4(q) {
  const P = MO.params, L = P.lift_servo_tip, T = { fixed: new THREE.Matrix4() };
  T.turret = rotAbout([0, 0, 0], [0, 0, 1], q.psi);
  T.crank = T.turret.clone().multiply(rotAbout([0, L[1], L[2]], [1, 0, 0], q.theta - P.lift_theta0));
  if (MO.kind === "parallel") {   // hybrid: parallelogram, links swing -a0..+a0, the coupler translates (stays level)
    const a = Math.asin(Math.max(-1, Math.min(1, q.h / P.link_len - Math.sin(P.a0 * D2R)))), da = a / D2R + P.a0;
    T.linkA = T.turret.clone().multiply(rotAbout([0, P.pa[0], P.pa[1]], [1, 0, 0], da));
    T.linkB = T.turret.clone().multiply(rotAbout([0, P.pb[0], P.pb[1]], [1, 0, 0], da));
    T.lift = T.turret.clone().multiply(new THREE.Matrix4().makeTranslation(0, P.link_len * (Math.cos(a) - Math.cos(P.a0 * D2R)), q.h));
  } else
  T.lift = MO.kind === "shoulder"     // redesign: the arm tilts about the shoulder axis (along X) so the can rises q.h
    ? T.turret.clone().multiply(rotAbout([0, P.shoulder[0], P.shoulder[1]], [1, 0, 0], Math.asin(Math.max(0, Math.min(1, q.h / P.can_y))) / D2R))
    : T.turret.clone().multiply(new THREE.Matrix4().makeTranslation(0, 0, q.h));
  T.wrist = T.lift.clone().multiply(rotAbout([0, 0, P.grip_z], [0, 1, 0], q.phi));
  T.finger_R = T.wrist.clone().multiply(rotAbout([P.pivot_x, P.pivot_y, 0], [0, 0, 1], -q.alpha));
  T.finger_L = T.wrist.clone().multiply(rotAbout([-P.pivot_x, P.pivot_y, 0], [0, 0, 1], q.alpha));
  return T;
}
const RT = (() => { if (!MO) return null;
  const SEQ = MO.sequence, DUR = { HOME: 0.6, GRIP: 0.8, LIFT: 1.0, FLIP: 1.5, TURN: 1.5, LOWER: 1.0, RELEASE: 0.6,
    "H-LIFT": 1.0, "H-CLOSE": 0.8, "H-WRIST": 1.5, "H-TURN": 1.5, "H-LOWER": 1.0, "H-OPEN": 0.8 }, PAUSE = { RELEASE: 1.6, "H-OPEN": 1.0 };
  const cnt = {}; SEQ.forEach(q => cnt[q.label] = (cnt[q.label] || 0) + 1);
  const times = [], canM = []; let t = 0, gripW = null, Tc = new THREE.Matrix4();
  SEQ.forEach((q, i) => {
    if (i > 0 && SEQ[i - 1].label !== q.label && PAUSE[SEQ[i - 1].label]) t += PAUSE[SEQ[i - 1].label];
    t += (DUR[q.label] || 1) / cnt[q.label]; times.push(t);
    const T = mats4(q);

// ---------------- MEASURE FIRST: animated how-to + fill-in sheet (rows from docs/17_tolerance_recheck.md)
const M = (() => {
  const svg = $("msvg"), NS = "http://www.w3.org/2000/svg";
  const RED = "#c40000", GRN = "#0a7a2f", INK = "#14181d";
  svg.innerHTML = `
  <defs><marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
  <text id="mCap" x="30" y="44" font-size="28" font-weight="800" fill="${INK}"></text>
  <text id="mSub" x="30" y="76" font-size="18" fill="#444"></text>
  <g id="mTop">
    <text x="330" y="112" font-size="15" fill="#666" text-anchor="middle">looking down into the hole (oval exaggerated)</text>
    <rect x="170" y="128" width="320" height="250" rx="12" fill="#cfd6de" stroke="${INK}" stroke-width="2"/>
    <ellipse cx="330" cy="253" rx="86" ry="70" fill="#fff" stroke="${INK}" stroke-width="3"/>
    <g id="mCal">
      <rect x="-150" y="-15" width="300" height="30" rx="3" fill="#59616b" opacity=".38"/>
      <rect id="mJL" y="-10" width="12" height="20" fill="${INK}"/><rect id="mJR" y="-10" width="12" height="20" fill="${INK}"/>
      <line id="mAr" y1="0" y2="0" stroke="${RED}" stroke-width="3" marker-start="url(#mA)" marker-end="url(#mA)"/>
    </g>
    <path id="mTurn" d="M455,140 a95,95 0 0 1 60,85" fill="none" stroke="${INK}" stroke-width="4" marker-end="url(#mA)" opacity="0"/>
  </g>
  <g id="mSide" opacity="0">
    <text x="330" y="112" font-size="15" fill="#666" text-anchor="middle">the same hole cut in half, seen from the side</text>
    <path d="M190,130 H280 V350 L300,390 H190 z" fill="#cfd6de" stroke="${INK}" stroke-width="2"/>
    <path d="M470,130 H380 V350 L360,390 H470 z" fill="#cfd6de" stroke="${INK}" stroke-width="2"/>
    <line x1="160" y1="390" x2="500" y2="390" stroke="${INK}" stroke-width="5"/>
    <text x="330" y="414" font-size="15" fill="#444" text-anchor="middle">bed side: first layers bulge in ("elephant foot")</text>
    <line id="mSA" stroke-width="3" marker-start="url(#mA)" marker-end="url(#mA)"/>
    <text id="mSL" font-size="20" font-weight="800" text-anchor="middle"></text>
  </g>
  <g transform="translate(560,128)">
    <rect width="300" height="120" rx="12" fill="#2b3036"/>
    <text x="16" y="26" font-size="14" fill="#cfd6de">calipers screen</text>
    <rect x="16" y="36" width="268" height="68" rx="6" fill="#b9c7a6"/>
    <text id="mLcd" x="268" y="88" font-size="48" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end" fill="#1d2418">0.00</text>
    <text x="276" y="100" font-size="12" text-anchor="end" fill="#1d2418"></text>
  </g>
  <g transform="translate(560,282)" font-size="16">
    <text x="0" y="-10" font-size="15" fill="#666">your sheet</text>
    <rect width="300" height="34" fill="#e9edf1" stroke="${INK}"/><rect y="34" width="300" height="42" fill="#fff" stroke="${INK}"/>
    <line x1="150" y1="0" x2="150" y2="76" stroke="${INK}"/>
    <text x="75" y="23" text-anchor="middle" font-weight="700">Measured</text><text x="225" y="23" text-anchor="middle" font-weight="700">Measured (90°)</text>
    <text id="mV1" x="75" y="63" text-anchor="middle" font-size="24" font-weight="800" fill="${RED}"></text>
    <text id="mV2" x="225" y="63" text-anchor="middle" font-size="24" font-weight="800" fill="${RED}"></text>
  </g>
  <text id="mFoot" x="560" y="410" font-size="16" fill="#333"></text>
  <text id="mFoot2" x="560" y="432" font-size="16" fill="#333"></text>
  <text x="30" y="500" font-size="15" fill="#555">Shafts and outside sizes (hub, post): same two readings, with the big outside jaws.</text>`;
  const q = id => svg.querySelector("#" + id), set = (el, a) => Object.entries(a).forEach(([k, v]) => el.setAttribute(k, v));
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : (x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const seg = (t, a, b) => ease((t - a) / (b - a));
  const RX = 86, RY = 70, V1 = 6.08, V2 = 5.92, LOOP = 15.5;
  let t0 = 0, raf = 0, paused = false, tp = 0;
  function draw(t) {
    let ang = 90 * seg(t, 4.8, 6.2), gap = 30, lcd = "", cap, sub, v1 = "", v2 = "", f1 = "", f2 = "";
    if (t < 4.2) { gap = 30 + (2 * RX - 30) * seg(t, 0.5, 2.5); lcd = (V1 * gap / (2 * RX)).toFixed(2);
      cap = "1 · First reading"; sub = "Small top jaws inside the hole, open them until they just touch.";
      if (t > 2.9) { v1 = V1.toFixed(2); f1 = "Write it in “Measured”."; } }
    else if (t < 10) { v1 = V1.toFixed(2);
      if (t < 6.2) { gap = 2 * RX - (2 * RX - 30) * seg(t, 4.2, 4.8); lcd = t < 4.8 ? (V1 * gap / (2 * RX)).toFixed(2) : "- - -";
        cap = "2 · Turn the calipers a quarter turn"; sub = "Same hole, like going from 12 to 3 on a clock."; }
      else { gap = 30 + (2 * RY - 30) * seg(t, 6.3, 8.2); lcd = (V2 * gap / (2 * RY)).toFixed(2);
        cap = "2 · Second reading, 90° from the first"; sub = "Printed holes are often a little oval: the numbers differ.";
        if (t > 8.6) { v2 = V2.toFixed(2); f1 = "Write it in “Measured (90°)”."; f2 = "The SMALLER number is the one that counts."; } } }
    else { v1 = V1.toFixed(2); v2 = V2.toFixed(2); cap = "3 · Measure halfway down the hole"; sub = "Not at the bed side: the first layers bulge in and read too small."; }
    const side = seg(t, 9.8, 10.4);
    q("mTop").setAttribute("opacity", 1 - side); q("mSide").setAttribute("opacity", side);
    q("mCal").setAttribute("transform", `translate(330,253) rotate(${ang})`);
    set(q("mJL"), { x: -gap / 2 }); set(q("mJR"), { x: gap / 2 - 12 }); set(q("mAr"), { x1: -gap / 2 + 13, x2: gap / 2 - 13 });
    q("mAr").style.display = gap > 50 ? "" : "none";
    q("mTurn").setAttribute("opacity", t > 4.5 && t < 6.6 ? 1 : 0);
    if (t >= 10) {
      const y = 374 - (374 - 245) * seg(t, 12, 13.2), foot = Math.max(0, (y - 350) / 40) * 20;
      const xl = 280 + foot, xr = 380 - foot, good = t > 13.2, bad = t < 12;
      const col = good ? GRN : bad ? RED : "#555";
      set(q("mSA"), { x1: xl + 2, x2: xr - 2, y1: y, y2: y, stroke: col });
      const r = 6.08 - (100 - (xr - xl)) / 18.2 * 0.28;
      lcd = r.toFixed(2); set(q("mSL"), { x: 330, y: y - 14, fill: col }); q("mSL").textContent = good ? "✔ here" : bad ? "✘ too small here" : "";
      f1 = good ? "Halfway down: the real hole size." : "At the bed: reads ~0.3 mm small."; f2 = "";
    }
    q("mCap").textContent = cap; q("mSub").textContent = sub; q("mLcd").textContent = lcd || "0.00";
    q("mV1").textContent = v1; q("mV2").textContent = v2; q("mFoot").textContent = f1; q("mFoot2").textContent = f2;
    document.querySelectorAll("#mbar [data-t]").forEach(b => b.classList.toggle("on", t >= +b.dataset.t && t < ({ "0": 4.2, "4.2": 10, "10": 99 })[b.dataset.t]));
  }
  function loop(now) { const t = paused ? tp : ((now - t0) / 1000) % LOOP; tp = t; draw(t); raf = requestAnimationFrame(loop); }
  function start(at) { $("measure").classList.remove("pic"); cancelAnimationFrame(raf); paused = false; $("mpause").textContent = "❚❚ Pause"; t0 = performance.now() - at * 1000; raf = requestAnimationFrame(loop); }
  function stop() { cancelAnimationFrame(raf); }
  document.querySelectorAll("#mbar [data-t]").forEach(b => b.onclick = () => start(+b.dataset.t));
  $("mpause").onclick = () => { if (paused) { start(tp); } else { paused = true; $("mpause").textContent = "▶ Play"; } };

  // ---- the sheet
  const KEY = "conceptA.measure.v1";
  let vals = {}; try { vals = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(vals)); } catch (e) {} };
  let rows = null;
  async function load() {
    if (rows) return rows;
    const md = await (await fetch("../docs/17_tolerance_recheck.md")).text();
    rows = []; let sec = null, hdr = null;
    for (const l of md.split("\n")) {
      if (l.startsWith("## ")) { sec = /^## ([ABC])\./.test(l) ? l.slice(3) : null; hdr = null; continue; }
      if (!sec || !l.startsWith("|") || /^\|[\s|:-]+\|$/.test(l.trim())) continue;
      const c = l.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim().replace(/\*\*/g, ""));
      if (!hdr) { hdr = c; continue; }
      const g = k => c[hdr.findIndex(h => h === k)] ?? "";
      const what = hdr.includes("Part") ? `${g("Part")}: ${g("Measure") || g("Feature")}` : g("Feature");
      rows.push({ sec, id: c[0], what, cad: g("CAD") || g("Nominal"), no90: g("Measured (90°)") === "—", fit: hdr.includes("Fit with the real part") ? (g("Fit with the real part") || "fit") : null });
    }
    return rows;
  }
  const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  async function info(I) {
    I.innerHTML = `<div class="head"><span class="big">M</span><h2>Measure first: CAD file vs real part</h2></div>
      <div class="lvl precise"><b>BEFORE STEP 1</b>Send these numbers before the PRECISE FIT steps (1, 7, 16, 19): the holes get corrected and those parts reprinted. EASY steps can go ahead.</div>
      <div class="box"><h3>How (watch the animation)</h3><ul>
        <li><b>Hole:</b> small top jaws inside, measure, turn the calipers a quarter turn, measure again: write <b>both</b>.</li>
        <li>Halfway down the hole, not at the bed side.</li>
        <li><b>Shaft / outside:</b> big jaws, two readings 90° apart.</li>
        <li>Zero the calipers first; close the jaws until they just touch, don't squeeze.</li>
        <li><b>Fit:</b> press (needs force) · snug (by hand, no play) · loose (wobbles) · no (won't go in).</li></ul></div>
      <div id="mSheet">Loading the sheet…</div>`;
    let R; try { R = await load(); } catch (e) { $("mSheet").textContent = "Couldn't load docs/17_tolerance_recheck.md: use the PDF manual pages M0–M0c."; return; }
    if (!steps[cur].measure) return;
    let h = "", last = "";
    for (const r of R) {
      if (r.sec !== last) { h += `<h4>${esc(r.sec)}</h4>`; last = r.sec; }
      const v = vals[r.id] || {};
      h += `<div class="mrow" data-id="${r.id}"><div class="top"><span class="id">${r.id}</span><span>${esc(r.what)}</span><span class="cad">CAD ${esc(r.cad)}</span></div>
        <img class="pic" src="data/measure/${r.id}.png" loading="lazy" alt="${esc(r.id + ' ' + r.what)}" title="Click: show it big">
        <div class="in"><input inputmode="decimal" placeholder="Measured" data-k="a" value="${esc(v.a || "")}">
        <input inputmode="decimal" placeholder="${r.no90 ? "90°: not needed" : "90°"}" data-k="b" value="${esc(v.b || "")}" ${r.no90 ? 'class="opt" title="A length / thickness / screw: one reading is enough. Type a 2nd one if you like."' : ""}>
        ${r.fit ? `<select data-k="f" title="${esc(r.fit)}"><option value="">${esc(r.fit)}</option>${["press", "snug", "loose", "no", "yes"].map(o => `<option ${v.f === o ? "selected" : ""}>${o}</option>`).join("")}</select>` : "<span></span>"}</div></div>`;
    }
    h += `<div class="box"><h3>Also note</h3><input data-k="note" data-id="NOTE" placeholder="filament brand, nozzle / bed °C, settings" value="${esc((vals.NOTE || {}).note || "")}" style="width:100%;font:14px system-ui;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink)"></div>
      <button class="tb" id="mCopy" style="width:100%;justify-content:center;padding:10px;font-size:15px">Copy my numbers (paste them in the chat)</button>
      <p style="font-size:12.5px;color:var(--muted)">Saved in this browser as you type.</p>`;
    $("mSheet").innerHTML = h;
    $("mSheet").addEventListener("click", e => { const im = e.target.closest(".pic"); if (!im) return;
      stop(); paused = true; $("mpause").textContent = "▶ Animation"; $("mpic").src = im.src; $("measure").classList.add("pic"); });
    const mark = el => { const v = vals[el.dataset.id] || {}; el.classList.toggle("done", !!v.a); };
    $("mSheet").querySelectorAll(".mrow").forEach(mark);
    $("mSheet").addEventListener("input", e => { const el = e.target, row = el.closest("[data-id]") || el; const id = row.dataset.id || el.dataset.id;
      (vals[id] = vals[id] || {})[el.dataset.k] = el.value.trim(); save(); if (row.classList.contains("mrow")) mark(row); });
    $("mCopy").onclick = async () => {
      const out = R.filter(r => vals[r.id] && (vals[r.id].a || vals[r.id].f)).map(r => { const v = vals[r.id];
        return `${r.id} ${r.what} | CAD ${r.cad} | ${v.a || "-"}${r.no90 && !v.b ? "" : " / " + (v.b || "-")}${v.f ? " | fit " + v.f : ""}`; });
      if (vals.NOTE && vals.NOTE.note) out.push("Note: " + vals.NOTE.note);
      const txt = out.join("\n") || "(nothing filled in yet)";
      try { await navigator.clipboard.writeText(txt); $("mCopy").textContent = "Copied ✔ (" + out.length + " lines)"; }
      catch (e) { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "width:100%;height:160px"; $("mCopy").after(ta); ta.select(); $("mCopy").textContent = "Select all + copy the box below"; }
    };
  }
  return { start, stop, info };
})();

// ---------------- controls
$("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
$("replay").onclick = () => go(cur); $("fit").onclick = () => frame(steps[cur], false);
[ghostEl, realEl].forEach(e => e.onchange = () => go(cur));
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
const goHash = () => { const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  const i = steps.findIndex(s => String(s.n).toLowerCase() === h || (h === "measure" && s.measure) || (h === "run" && s.run)); go(i < 0 ? 0 : i); };
resize(); goHash();
addEventListener("hashchange", goHash);
requestAnimationFrame(tick); requestAnimationFrame(camStep);
})();
